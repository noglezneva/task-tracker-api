version: "3.9"

services:
  db:
    image: postgres:16
    container_name: task-tracker-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-task_tracker}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-task_tracker}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: task-tracker-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: task-tracker-api
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8000"
    command: >
      bash -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"

  celery-worker:
    build: .
    container_name: task-tracker-celery-worker
    restart: always
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery
      -A app.core.celery_app.celery_app
      worker
      --loglevel=info

  celery-beat:
    build: .
    container_name: task-tracker-celery-beat
    restart: always
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    command: >
      celery
      -A app.core.celery_app.celery_app
      beat
      --loglevel=info

volumes:
  postgres_data: